services:
  - type: web
    name: chrisenriquezdev
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    # React Router uses client-side routes (/about, /project/:id). Without this
    # rewrite, a hard refresh or direct hit on one of those paths 404s because
    # no matching file exists on disk. Serve index.html for anything that isn't
    # a real static asset and let the router take over.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
